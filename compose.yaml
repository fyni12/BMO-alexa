services:
  api:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: bmo-api
    ports:
      - "192.168.137.1:${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/bmo_db
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: bmo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: